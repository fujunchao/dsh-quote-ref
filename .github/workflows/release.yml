name: Release package

# Builds the distributable plugin archive and attaches it to a GitHub Release.
# Runs on the runner, so no local upload host is needed; workflow_dispatch can backfill an
# existing release (for example when the asset upload failed on the authoring machine).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the package to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag against package.json
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${TAG#v}
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the bundle before packaging
        run: node --test

      - name: Build the archives
        run: |
          set -euo pipefail
          NAME=dsh-quote-ref
          STAGE="dist/$NAME"
          mkdir -p "$STAGE"
          cp -r package.json lib scripts test README.md CHANGELOG.md LICENSE "$STAGE"/
          (cd dist && zip -qr "$NAME-$VERSION.zip" "$NAME")
          tar -C dist -czf "dist/$NAME-$VERSION.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME-$VERSION.zip" "$NAME-$VERSION.tar.gz" > SHA256SUMS.txt)
          ls -l dist

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$TAG"
          gh release upload "$TAG" \
            "dist/dsh-quote-ref-$VERSION.zip" \
            "dist/dsh-quote-ref-$VERSION.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summarise
        run: |
          {
            echo "### dsh-quote-ref $VERSION"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
