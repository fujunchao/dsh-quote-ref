name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Headless bundle test suite
        run: node --test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package manifest and bundle exports
        run: |
          node -e "const p=require('./package.json'); if(p.dsh.client.platform!=='web') throw new Error('platform must be web'); console.log('manifest ok', p.name, p.version)"
          node --check lib/index.js
